<!-- Le avisa al navegador que la página está programada en HTML5 -->
<!DOCTYPE html>

<!-- Define que el idioma principal de la pagina es español -->
<html lang="es">

<head>
    <!-- Para las tildes, ñ y acentos  -->
    <meta charset="UTF-8">
    
    <!-- Para que la página se adapte a todo tipo de pantallas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- El nombre que sale arriba en la pestaña del navegador -->
    <title>Imagenes en HTML</title>
</head>

<!-- Se muestra todo el contenido de la pagina -->
<body>
    <!-- Título principal de la sección -->
    <h2>Imagenes en HTML</h2>

    <!-- Subtítulo para organizar el contenido -->
    <h3>Locales</h3>
    <!-- 'src' busca la foto en la misma carpeta. 'alt' es el texto que sale si no carga o para lectores de pantalla -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <h3>Locales redismensionado</h3>
    <!-- 'imagenes/' entra a esa subcarpeta. 'width' y 'height' fuerzan el tamaño de la foto en píxeles -->
    <img src="imagenes/carita.png" alt="Carita feliz ajustada" width="200" height="100">

    <h3>Desde internet</h3>
    <!-- En lugar de guardar la foto en tu computadora, pegas el enlace directo de la web -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="Carita desde internet">

    <h3>Animaciones</h3>
    <!-- Sirve de la misma manera para mostrar un GIF animado usando su enlace -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="GIF animado">
</body>

</html>
</html>
