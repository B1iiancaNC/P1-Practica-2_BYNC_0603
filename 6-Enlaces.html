<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Para que se lean bien tildes, eñes y acentos -->
    <meta charset="UTF-8">
    
    <!-- Para adaptarlo a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título de la pestaña -->
    <title>Enlaces en HTML</title>
</head>
<body>
    <!-- Título principal -->
    <h2>Tipos de enlaces en HTML</h2>

    <!-- Subtítulo de enlaces internos -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    
    <!-- Enlace normal (abre en la misma pestaña por defecto) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>

    <!-- target="_self" abre en la misma pestaña -->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>

    <!-- target="_blank" abre en una ventana o pestaña nueva -->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>

    <!-- target="_parent" abre en el marco o ventana padre -->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>

    <!-- target="_top" abre en el cuerpo completo de la ventana cancelando marcos -->
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>

    <!-- Subtítulo de enlaces externos -->
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    
    <!-- Enlace a web externa -->
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    
    <!-- Enlace externo que abre en nueva pestaña -->
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
</html>
